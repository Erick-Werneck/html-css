<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela</title>
    <style>
        table{
            border-collapse: collapse;
            width: 300px;
            height: 300px;
        }

        td{
            border: 1px solid black;
            padding: 5px;
            vertical-align: middle;
        }

        .num{
            text-align: end;
        }
    </style>
</head>
<body>
    <h1>Minha primeira tabela</h1>
<!-- 
    Hierarquia de tabelas(Simples)
    table = tabela
        table row = linha de tabela <tr>
            table header = cabeçalho de tabela <th>
            table data = dado de tabela <td>
-->
    <table>
<tr>
    <td>A1</td>
    <td>B1</td>
    <td class="num">C1</td>
</tr>

<tr>
    <td>A2</td>
    <td class="num">B2</td>
    <td>C2</td>
</tr>

<tr>
    <td>A3</td>
    <td>B3</td>
    <td>C3</td>
</tr>

<tr>
    <td>A4</td>
    <td>B4</td>
    <td>C4</td>
</tr>
    </table>
</body>
</html>
