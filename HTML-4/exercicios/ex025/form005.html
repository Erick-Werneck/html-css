<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formulário</title>
</head>
<body>
    <form action="" method="get" autocomplete="on">
        <fieldset>
            <legend>Sexo</legend>
            <input type="radio" name="sexo" id="sxmas" checked value="M"><label for="sxmas">Masculino</label><br>
            <input type="radio" name="sexo" id="sxfem" value="F"><label for="sxfem">Feminino</label>
        </fieldset>

        <fieldset>
            <legend>Esportes favoritos</legend>
            <input type="checkbox" name="esbas" id="esbas"><label for="esbas">basquete</label> <br>
            <input type="checkbox" name="esfut" id="esfut"><label for="esfut">futebol</label> <br>
            <input type="checkbox" name="esten" id="esten"><label for="esten">tenis</label> <br>
            <input type="checkbox" name="esvol" id="esvol"><label for="esvol">volei</label> <br>
        </fieldset>

        <p>
            <input type="submit" value="enviar">
        </p>
    </form>
</body>
</html>
